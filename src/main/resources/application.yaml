spring:
  application:
    name: MTWGEasy

  datasource:
    # IDE/local default. Docker overrides DB_PATH to its persistent volume.
    url: jdbc:sqlite:${DB_PATH:./db.sqlite}
    driver-class-name: org.sqlite.JDBC

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate.format_sql: true
    properties.hibernate.entityManagerFactoryInterface: jakarta.persistence.EntityManagerFactory
